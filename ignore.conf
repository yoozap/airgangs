# Unity Version Control ignore rules for tbilisifly.
#
# UVCS does NOT read .gitignore -- this file is the equivalent and it must be
# checked in so every teammate gets it. A pattern with no slash matches by name
# at any depth; a pattern with a slash is relative to the workspace root.
#
# Rule of thumb for this project: if tools/ or the Unity editor can regenerate
# it, it does not belong in the cloud.

# ---------------------------------------------------------------------------
# Unity generated. Library/ alone is 5.1 GB of import cache on this machine.
# ---------------------------------------------------------------------------
Library/
Temp/
Obj/
obj/
Logs/
UserSettings/
MemoryCaptures/
Recordings/
Build/
Builds/
*.csproj
*.sln
*.slnx
*.suo
*.user
*.userprefs
*.unityproj
*.pidb
*.booproj
*.svd
*.apk
*.aab
*.unitypackage
sysinfo.txt
.vsconfig

# ---------------------------------------------------------------------------
# Project-specific output and junk
# ---------------------------------------------------------------------------
# Built players
build/
unity/Tbilisi_BackUpThisFolder_ButDontShipItWithYourGame/

# A stray nested project: a Tbilisi.app player build plus its own 1.2 GB
# Library that got written here instead of build/. Pure output.
unity/Tbilisifly/

# Editor crash dumps (54 of them, 60 MB, as of the migration)
mono_crash*

# The play-mode runner drops InitTestScene<random-guid>.unity into Assets/ on
# every -runTests pass and does not reliably clean it up. Never version these.
unity/Assets/InitTestScene*

# ---------------------------------------------------------------------------
# Re-fetchable asset sources: ~12 GB that the scripts in tools/ pull down and
# bake into what the game actually loads. Regenerate, never sync.
# ---------------------------------------------------------------------------
tools/cache/
tools/trees_src/
tools/park_src/
tools/gis/
tools/__pycache__/
models_raw/
*.pyc

# ---------------------------------------------------------------------------
# JS build (deprioritised, kept as the port spec)
# ---------------------------------------------------------------------------
node_modules/
dist/

# ---------------------------------------------------------------------------
# OS, editors, secrets, scratch
# ---------------------------------------------------------------------------
.DS_Store
._*
.Trashes
*.swp
*~
.idea/
.vscode/
.env
.env.*
undefined/
undefined_*.png
Screenshot*.png
